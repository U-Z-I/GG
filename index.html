<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #718096;
      --primary: #6366f1;
      --danger: #ef4444;
      --border: #e5e7eb;
    }

    body.dark {
      --bg: #111827;
      --card: #1f2937;
      --text: #f9fafb;
      --muted: #9ca3af;
      --border: #374151;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: 0.3s;
    }

    .container {
      width: min(1100px, 92%);
      margin: auto;
      padding: 30px 0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 32px;
    }

    header p {
      color: var(--muted);
      margin-top: 5px;
    }

    button {
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }

    .theme-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 18px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 15px;
    }

    .stat h3 {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .stat strong {
      font-size: 28px;
    }

    .progress-container {
      background: var(--card);
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 25px;
      border: 1px solid var(--border);
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .progress {
      height: 10px;
      background: var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      transition: width 0.4s;
    }

    .panel {
      background: var(--card);
      padding: 25px;
      border-radius: 15px;
      border: 1px solid var(--border);
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 150px 120px;
      gap: 10px;
      margin-bottom: 20px;
    }

    input,
    select {
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      background: var(--bg);
      color: var(--text);
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
    }

    .add-btn {
      background: var(--primary);
      color: white;
      border-radius: 9px;
      font-weight: bold;
    }

    .add-btn:hover {
      background: #4f46e5;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
    }

    .filters {
      display: flex;
      gap: 7px;
    }

    .filter-btn {
      padding: 9px 14px;
      background: var(--bg);
      color: var(--text);
      border-radius: 8px;
    }

    .filter-btn.active {
      background: var(--primary);
      color: white;
    }

    .search {
      width: 220px;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg);
      animation: slideIn 0.25s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .check {
      width: 22px;
      height: 22px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .task-content {
      flex: 1;
    }

    .task-title {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .task.completed .task-title {
      text-decoration: line-through;
      opacity: 0.5;
    }

    .task-meta {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .priority {
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
    }

    .low {
      background: #dcfce7;
      color: #166534;
    }

    .medium {
      background: #fef3c7;
      color: #92400e;
    }

    .high {
      background: #fee2e2;
      color: #991b1b;
    }

    .delete-btn {
      background: transparent;
      color: var(--danger);
      font-size: 18px;
      padding: 5px;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }

    @media (max-width: 750px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .input-row {
        grid-template-columns: 1fr;
      }

      .toolbar {
        flex-direction: column;
      }

      .search {
        width: 100%;
      }

      .filters {
        overflow-x: auto;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <div>
        <h1>TaskFlow</h1>
        <p>Organize your work. Get things done.</p>
      </div>

      <button class="theme-btn" id="themeBtn">🌙</button>
    </header>

    <section class="stats">
      <div class="stat">
        <h3>Total Tasks</h3>
        <strong id="totalTasks">0</strong>
      </div>

      <div class="stat">
        <h3>Completed</h3>
        <strong id="completedTasks">0</strong>
      </div>

      <div class="stat">
        <h3>Pending</h3>
        <strong id="pendingTasks">0</strong>
      </div>

      <div class="stat">
        <h3>High Priority</h3>
        <strong id="highTasks">0</strong>
      </div>
    </section>

    <section class="progress-container">
      <div class="progress-info">
        <strong>Overall Progress</strong>
        <span id="progressText">0%</span>
      </div>

      <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </section>

    <section class="panel">
      <div class="input-row">
        <input
          id="taskInput"
          type="text"
          placeholder="What needs to be done?"
        >

        <select id="priorityInput">
          <option value="low">Low Priority</option>
          <option value="medium">Medium Priority</option>
          <option value="high">High Priority</option>
        </select>

        <button class="add-btn" id="addBtn">
          + Add Task
        </button>
      </div>

      <div class="toolbar">
        <div class="filters">
          <button class="filter-btn active" data-filter="all">
            All
          </button>

          <button class="filter-btn" data-filter="active">
            Active
          </button>

          <button class="filter-btn" data-filter="completed">
            Completed
          </button>
        </div>

        <input
          class="search"
          id="searchInput"
          placeholder="🔍 Search tasks..."
        >
      </div>

      <div class="task-list" id="taskList"></div>
    </section>

  </div>

  <script>
    let tasks = JSON.parse(
      localStorage.getItem("taskflow_tasks")
    ) || [];

    let currentFilter = "all";

    const taskInput = document.getElementById("taskInput");
    const priorityInput = document.getElementById("priorityInput");
    const addBtn = document.getElementById("addBtn");
    const taskList = document.getElementById("taskList");
    const searchInput = document.getElementById("searchInput");

    const totalTasks = document.getElementById("totalTasks");
    const completedTasks = document.getElementById("completedTasks");
    const pendingTasks = document.getElementById("pendingTasks");
    const highTasks = document.getElementById("highTasks");

    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");

    function saveTasks() {
      localStorage.setItem(
        "taskflow_tasks",
        JSON.stringify(tasks)
      );
    }

    function addTask() {
      const title = taskInput.value.trim();

      if (!title) {
        alert("Please enter a task.");
        return;
      }

      const task = {
        id: Date.now(),
        title: title,
        priority: priorityInput.value,
        completed: false,
        createdAt: new Date().toISOString()
      };

      tasks.unshift(task);

      saveTasks();

      taskInput.value = "";

      render();
    }

    function toggleTask(id) {
      tasks = tasks.map(task => {
        if (task.id === id) {
          return {
            ...task,
            completed: !task.completed
          };
        }

        return task;
      });

      saveTasks();
      render();
    }

    function deleteTask(id) {
      tasks = tasks.filter(
        task => task.id !== id
      );

      saveTasks();
      render();
    }

    function getVisibleTasks() {
      const searchTerm =
        searchInput.value.toLowerCase().trim();

      return tasks.filter(task => {
        const matchesSearch =
          task.title
            .toLowerCase()
            .includes(searchTerm);

        let matchesFilter = true;

        if (currentFilter === "active") {
          matchesFilter = !task.completed;
        }

        if (currentFilter === "completed") {
          matchesFilter = task.completed;
        }

        return matchesSearch && matchesFilter;
      });
    }

    function renderTasks() {
      const visibleTasks = getVisibleTasks();

      if (visibleTasks.length === 0) {
        taskList.innerHTML = `
          <div class="empty">
            <h3>No tasks found 🎉</h3>
            <p>Try adding a new task.</p>
          </div>
        `;

        return;
      }

      taskList.innerHTML = visibleTasks
        .map(task => {
          return `
            <div class="task ${
              task.completed ? "completed" : ""
            }">

              <input
                class="check"
                type="checkbox"
                ${
                  task.completed ? "checked" : ""
                }
                onchange="toggleTask(${task.id})"
              >

              <div class="task-content">
                <div class="task-title">
                  ${escapeHTML(task.title)}
                </div>

                <div class="task-meta">
                  <span class="priority ${task.priority}">
                    ${task.priority.toUpperCase()}
                  </span>

                  <small>
                    ${formatDate(task.createdAt)}
                  </small>
                </div>
              </div>

              <button
                class="delete-btn"
                onclick="deleteTask(${task.id})"
                title="Delete task"
              >
                🗑️
              </button>

            </div>
          `;
        })
        .join("");
    }

    function updateStats() {
      const total = tasks.length;

      const completed =
        tasks.filter(task => task.completed).length;

      const pending =
        tasks.filter(task => !task.completed).length;

      const high =
        tasks.filter(
          task =>
            task.priority === "high" &&
            !task.completed
        ).length;

      totalTasks.textContent = total;
      completedTasks.textContent = completed;
      pendingTasks.textContent = pending;
      highTasks.textContent = high;

      const progress =
        total === 0
          ? 0
          : Math.round((completed / total) * 100);

      progressBar.style.width = `${progress}%`;
      progressText.textContent = `${progress}%`;
    }

    function render() {
      renderTasks();
      updateStats();
    }

    function formatDate(date) {
      return new Date(date).toLocaleDateString(
        undefined,
        {
          month: "short",
          day: "numeric"
        }
      );
    }

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    addBtn.addEventListener("click", addTask);

    taskInput.addEventListener(
      "keydown",
      event => {
        if (event.key === "Enter") {
          addTask();
        }
      }
    );

    searchInput.addEventListener(
      "input",
      renderTasks
    );

    document
      .querySelectorAll(".filter-btn")
      .forEach(button => {
        button.addEventListener(
          "click",
          () => {
            document
              .querySelectorAll(".filter-btn")
              .forEach(btn =>
                btn.classList.remove("active")
              );

            button.classList.add("active");

            currentFilter =
              button.dataset.filter;

            renderTasks();
          }
        );
      });

    const themeBtn =
      document.getElementById("themeBtn");

    const savedTheme =
      localStorage.getItem("taskflow_theme");

    if (savedTheme === "dark") {
      document.body.classList.add("dark");
      themeBtn.textContent = "☀️";
    }

    themeBtn.addEventListener(
      "click",
      () => {
        document.body.classList.toggle("dark");

        const dark =
          document.body.classList.contains("dark");

        themeBtn.textContent =
          dark ? "☀️" : "🌙";

        localStorage.setItem(
          "taskflow_theme",
          dark ? "dark" : "light"
        );
      }
    );

    render();
  </script>
</body>
</html>
